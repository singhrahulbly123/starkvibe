name: Lighthouse SEO audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start production server
        run: npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/starkvibe-next.log 2>&1 &

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/starkvibe-next.log
          exit 1

      - name: Run Lighthouse audits
        continue-on-error: true
        run: |
          mkdir -p lighthouse-reports
          declare -A routes=(
            [home]="/"
            [shop]="/shop"
            [product]="/products/oversized-240-gsm-french-terry-tee"
            [blog]="/blog/how-to-choose-the-right-gsm-t-shirt"
            [locations]="/locations/delhi"
          )
          for name in "${!routes[@]}"; do
            npx --yes lighthouse@12.8.2 "http://127.0.0.1:3000${routes[$name]}" \
              --output=html,json \
              --output-path="lighthouse-reports/${name}" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --quiet
          done

      - name: Summarize Lighthouse results
        if: always()
        run: node scripts/summarize-lighthouse.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: error
          retention-days: 14
